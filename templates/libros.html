{% extends "base.html" %}

{% block content %}
    <h2>Lista de Libros Disponibles</h2>
    
    <table border="1" cellpadding="8" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background-color: #2c3e50; color: white;">
                <th>Título</th>
                <th>Autor</th>
                <th>Disponibilidad</th>
            </tr>
        </thead>
        <tbody>
            {% for libro in libros %}
            <tr>
                <td>{{ libro.titulo }}</td>
                <td>{{ libro.autor }}</td>
                <td>
                    {% if libro.disponibles > 0 %}
                        <span style="color: green; font-weight: bold;">Disponible ({{ libro.disponibles }})</span>
                    {% else %}
                        <span style="color: red; font-weight: bold;">No disponible</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
